<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NoahsArk 知识查询</title>
<style>
:root{--canvas:#f6f7f9;--paper:#fff;--ink:#172033;--muted:#667085;--line:#e4e7ec;--accent:#1769e0;--accent-soft:#e8f1ff;--good:#067647;--bad:#b42318}
*{box-sizing:border-box}
body{margin:0;background:var(--canvas);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
.shell{max-width:960px;margin:auto;padding:44px 20px 80px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:36px}
.mark{width:40px;height:40px;border-radius:12px;background:#172033;color:#fff;display:grid;place-items:center;font-size:20px;font-weight:800}
.brand h1{font-size:18px;margin:0}
.brand .sub{color:var(--muted);font-size:12px}
form{display:flex;gap:10px;margin-bottom:12px}
input[type=search]{flex:1;border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--paper);font-size:16px;outline:none}
input[type=search]:focus{border-color:var(--accent);box-shadow:0 0 0 4px #1769e01a}
button{border:0;border-radius:12px;padding:0 22px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer;font-size:15px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.filters input{width:150px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--paper);font-size:13px}
.meta{display:flex;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding-bottom:10px;color:var(--muted);font-size:13px;margin-bottom:6px}
.good{color:var(--good)}.bad{color:var(--bad)}
.results{display:grid;gap:10px;margin-top:12px}
.card{border:1px solid var(--line);border-radius:14px;background:var(--paper);overflow:hidden}
.card>summary{list-style:none;cursor:pointer;padding:14px 18px;display:block}
.card>summary::-webkit-details-marker{display:none}
.card>summary:hover{background:#fbfcfe}
.row1{display:flex;align-items:baseline;gap:10px}
.row1 h3{font-size:16px;margin:0;font-weight:700;flex:1}
.tag{display:inline-block;background:var(--accent-soft);color:#245aa8;border-radius:999px;padding:1px 9px;font-size:11px;white-space:nowrap}
.tag.doc{background:#f4f3ff;color:#5925dc}
.tag.pending{background:#fff6e5;color:#b54708}
.tag.active{background:#e7f6ec;color:#067647}
.line{color:#475467;font-size:13.5px;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cite{color:#98a2b3;font:11px ui-monospace,Consolas,monospace;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.body{border-top:1px solid var(--line);padding:16px 18px;background:#fcfcfd}
.body h4{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.claim{font-size:15px;line-height:1.75;margin:0 0 16px;white-space:pre-wrap}
.kv{display:grid;grid-template-columns:88px 1fr;gap:4px 12px;font-size:13px;margin-bottom:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;word-break:break-word}
.ev{margin:0;padding-left:18px;font-size:13px}
.ev li{margin-bottom:4px;word-break:break-all}
.doc-text{white-space:pre-wrap;font:13px/1.7 ui-monospace,Consolas,monospace;max-height:60vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px}
.chunk-h{font-weight:700;color:#245aa8;margin:14px 0 4px;font-size:13.5px}
.empty{text-align:center;color:var(--muted);padding:44px 0}
.error{padding:12px 14px;border-radius:10px;background:#fff1f0;color:var(--bad);border:1px solid #f3c4c0}
.loading{color:var(--muted);font-size:13px;padding:10px 0}
@media(max-width:640px){.shell{padding:24px 12px 56px}form{flex-direction:column}button{height:44px}.kv{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell">
  <div class="brand">
    <div class="mark">N</div>
    <div><h1>NoahsArk 知识查询</h1><div class="sub" id="health">检查中…</div></div>
  </div>

  <form id="form">
    <input id="q" type="search" placeholder="搜什么？例如：音量边界、唤醒、烧录判据" autocomplete="off">
    <button type="submit">搜索</button>
  </form>

  <div class="filters">
    <input id="device" placeholder="设备">
    <input id="firmware" placeholder="固件">
    <input id="type" placeholder="类型 knowledge/method/run/bug">
  </div>

  <div class="meta"><span id="count">—</span><span id="commit"></span></div>
  <div class="results" id="results"><div class="empty">输入关键词开始搜索</div></div>
</div>

<script>
const $ = id => document.getElementById(id);

function clean(text, limit) {
  if (!text) return '';
  let s = String(text);
  const cut = s.lastIndexOf('### ');
  if (cut > 0 && cut < 120) s = s.slice(cut + 4);
  s = s.replace(/^\s*#+\s*/gm, '').replace(/\|/g, ' ').replace(/\s+/g, ' ').trim();
  return limit && s.length > limit ? s.slice(0, limit) + '…' : s;
}

function flatten(data) {
  const rows = [];
  for (const src of data.sources || []) {
    for (const x of src.entries || []) rows.push({...x, kind: 'entry'});
    for (const x of src.documents || []) rows.push({
      id: x.doc_id, title: x.title || x.heading || x.document || x.doc_id,
      snippet: x.snippet, citation: x.citation, source: x.source, kind: 'doc',
      document: x.document, heading: x.heading
    });
  }
  if (!rows.length) {
    for (const x of data.hits || []) rows.push({
      ...x, kind: x.source === 'ark-kb' ? 'entry' : 'doc'
    });
  }
  return rows;
}

function makeCard(row) {
  const card = document.createElement('details');
  card.className = 'card';

  const summary = document.createElement('summary');
  const row1 = document.createElement('div');
  row1.className = 'row1';

  const h3 = document.createElement('h3');
  h3.textContent = row.title || row.id || '未命名';
  row1.append(h3);

  if (row.kind === 'doc') {
    const t = document.createElement('span');
    t.className = 'tag doc';
    t.textContent = '文档';
    row1.append(t);
  }
  if (row.status) {
    const t = document.createElement('span');
    t.className = 'tag ' + String(row.status);
    t.textContent = row.status;
    row1.append(t);
  }
  summary.append(row1);

  const line = document.createElement('div');
  line.className = 'line';
  line.textContent = clean(row.claim || row.snippet, 110) || '（无摘要，点击查看）';
  summary.append(line);

  const cite = document.createElement('div');
  cite.className = 'cite';
  cite.textContent = row.citation || '';
  summary.append(cite);

  card.append(summary);

  let loaded = false;
  card.addEventListener('toggle', async () => {
    if (!card.open || loaded) return;
    loaded = true;
    const body = document.createElement('div');
    body.className = 'body';
    body.innerHTML = '<div class="loading">加载中…</div>';
    card.append(body);
    try {
      body.replaceChildren(await renderDetail(row));
    } catch (err) {
      body.innerHTML = '<div class="error">读取失败：' + err.message + '</div>';
      loaded = false;
    }
  });

  return card;
}

function kv(pairs) {
  const dl = document.createElement('dl');
  dl.className = 'kv';
  for (const [k, v] of pairs) {
    if (v === null || v === undefined || v === '') continue;
    const dt = document.createElement('dt'); dt.textContent = k;
    const dd = document.createElement('dd'); dd.textContent = typeof v === 'object' ? JSON.stringify(v, null, 0) : String(v);
    dl.append(dt, dd);
  }
  return dl;
}

async function renderDetail(row) {
  const frag = document.createDocumentFragment();

  if (row.kind === 'entry') {
    const res = await fetch('/api/entry/' + encodeURIComponent(row.id));
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || data.error || '读取失败');
    const e = data.entry || data;

    const h4 = document.createElement('h4'); h4.textContent = '结论';
    const p = document.createElement('p'); p.className = 'claim'; p.textContent = e.claim || '（无 claim）';
    frag.append(h4, p);

    const scope = e.scope ? Object.entries(e.scope).filter(([, v]) => v).map(([k, v]) => [k, v]) : [];
    frag.append(kv([
      ['类型', e.type], ['置信度', e.confidence], ['状态', e.status],
      ['来源技能', e.source_skill], ['验证次数', (e.validations || []).length || null],
      ...scope
    ]));

    if (e.evidence && e.evidence.length) {
      const eh = document.createElement('h4'); eh.textContent = '证据';
      const ul = document.createElement('ul'); ul.className = 'ev';
      for (const ev of e.evidence) {
        const li = document.createElement('li');
        li.textContent = [ev.kind, ev.ref, ev.note].filter(Boolean).join(' · ');
        ul.append(li);
      }
      frag.append(eh, ul);
    }
    return frag;
  }

  const docId = String(row.document || row.id || '').split('#')[0];
  const res = await fetch('/api/doc/' + encodeURIComponent(docId));
  const data = await res.json();
  if (!res.ok) throw new Error(data.message || data.error || '文档读取失败');
  const meta = data.document || {};
  frag.append(kv([['文件', meta.path || docId], ['类型', meta.kind], ['状态', meta.status], ['字数', meta.char_count]]));

  const box = document.createElement('div');
  box.className = 'doc-text';
  let lastHeading = null;
  for (const c of data.chunks || []) {
    const text = clean(c.text, 0);
    if (c.heading && c.heading !== lastHeading) {
      const h = document.createElement('div');
      h.className = 'chunk-h';
      h.textContent = c.heading;
      box.append(h);
      lastHeading = c.heading;
    }
    box.append(document.createTextNode(text + '\n'));
  }
  if (!data.chunks || !data.chunks.length) box.textContent = '（无正文）';
  frag.append(box);
  return frag;
}

async function search(ev) {
  ev.preventDefault();
  const params = new URLSearchParams();
  const q = $('q').value.trim();
  if (q) params.set('q', q);
  for (const k of ['device', 'firmware', 'type']) {
    const v = $(k).value.trim();
    if (v) params.set(k, v);
  }
  if (!params.size) return;
  $('results').innerHTML = '<div class="empty">查询中…</div>';
  try {
    const res = await fetch('/api/search?' + params);
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || data.error);
    const rows = flatten(data);
    $('count').textContent = rows.length + ' 条结果';
    $('commit').textContent = 'commit ' + String(data.commit || data.source_commit || '').slice(0, 10);
    $('results').replaceChildren();
    if (!rows.length) { $('results').innerHTML = '<div class="empty">没有命中</div>'; return; }
    rows.forEach(r => $('results').append(makeCard(r)));
  } catch (err) {
    $('results').innerHTML = '<div class="error">查询失败：' + err.message + '</div>';
  }
}

async function health() {
  try {
    const d = await (await fetch('/api/healthz')).json();
    $('health').textContent = d.version + ' · ' + d.freshness + ' · ' + d.entries + ' 条';
    $('health').className = d.status === 'ok' ? 'good' : 'bad';
  } catch { $('health').textContent = '服务不可达'; $('health').className = 'bad'; }
}

$('form').addEventListener('submit', search);
health();
</script>
</body>
</html>
